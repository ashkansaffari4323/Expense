<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACC Expenses</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header class="top"><div><h1>ACC Expenses</h1><p>Multi-project expense import</p></div><div id="auth"><a class="btn primary" href="/api/auth/login">Sign in to Autodesk</a></div></header><main id="app" class="hidden layout"><aside class="sidebar"><div class="field"><label>Hub</label><select id="hub"></select></div><div class="projectHead"><label>Projects you can access, up to 100</label><span id="count">0 selected</span></div><input id="projectSearch" class="search" placeholder="Search projects by name..."><div class="bulk"><button id="selectVisible" class="mini" type="button">Select visible</button><button id="clearProjects" class="mini" type="button">Clear</button></div><div id="projects" class="projects"></div><button id="load" class="btn full">Load selected projects</button><a id="template" class="btn full disabled" href="#">Download template</a><div class="field"><label>Upload Excel</label><input id="file" type="file" accept=".xlsx,.xls"></div><button id="preview" class="btn full">Preview Excel</button><button id="create" class="btn primary full">Create Expenses</button></aside><section class="content"><div id="err" class="err hidden"></div><div id="cards" class="cards"></div><div class="panel"><div class="panelTitle"><h2>Excel Preview</h2><span>Reference Number can duplicate. Existing Expense Name in Forma/ACC is blocked.</span></div><div class="scroll"><table><thead><tr><th>Row</th><th>Project Name</th><th>Reference No</th><th>Expense</th><th>Line Item</th><th>Qty</th><th>Unit Price</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="9">No Excel file read yet.</td></tr></tbody></table></div></div><div class="panel"><div class="panelTitle"><h2>Results</h2><div class="resultActions"><button id="copyFullResult" class="mini" type="button">Copy full API result</button><button id="clearLog" class="mini" type="button">Clear</button></div></div><div id="resultCards" class="resultCards"></div><textarea id="log" class="apiText" readonly>No import run yet.</textarea></div></section></main></div><script src="app.js"></script></body></html>
